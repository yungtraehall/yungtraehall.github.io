<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Random Generator</title>

    <link rel="stylesheet" href="css/styles.css">
    <script src="data/gen1.js" defer></script>
    <script src="data/gen2.js" defer></script>
    <script src="data/gen3.js" defer></script>
    <script src="data/gen4.js" defer></script>
    <script src="data/gen5.js" defer></script>
    <script src="data/gen6.js" defer></script>
    <script src="data/gen7.js" defer></script>
    <script src="data/gen8.js" defer></script>
    <script src="data/gen9.js" defer></script>
    <script src="data/champions-ou.js" defer></script>
    <script src="data/national-dex.js" defer></script>
    <script src="data/pokemon-details.js" defer></script>
    <script src="js/details.js" defer></script>
    <script src="js/script.js" defer></script>
</head>

<body>

    <main class="container">

        <h1>Pokémon Random Generator</h1>

        <p class="description">
            Generate six random Pokémon.
        </p>

        <div class="generator-settings">

            <div class="setting">
                <label for="pool-select">Pool</label>

                <select id="pool-select">
                    <option value="gen1">Generation 1</option>
                    <option value="gen2">Generation 2</option>
                    <option value="gen3">Generation 3</option>
                    <option value="gen4">Generation 4</option>
                    <option value="gen5" selected>Generation 5</option>
                    <option value="gen6">Generation 6</option>
                    <option value="gen7">Generation 7</option>
                    <option value="gen8">Generation 8</option>
                    <option value="gen9">Generation 9</option>
                    <option value="championsou">Pokémon Champions OU</option>
                    <option value="nationaldex">National Dex</option>
                    <option value="bananza">Bananza (No Tier Ceiling)</option>
                </select>
            </div>

            <div class="setting" id="type-pool-setting" hidden>
                <label for="type-pool-select">Bananza Type</label>
                <select id="type-pool-select">
                    <option value="All">All types</option>
                    <option value="Bug">Bug</option>
                    <option value="Dark">Dark</option>
                    <option value="Dragon">Dragon</option>
                    <option value="Electric">Electric</option>
                    <option value="Fairy">Fairy</option>
                    <option value="Fighting">Fighting</option>
                    <option value="Fire">Fire</option>
                    <option value="Flying">Flying</option>
                    <option value="Ghost">Ghost</option>
                    <option value="Grass">Grass</option>
                    <option value="Ground">Ground</option>
                    <option value="Ice">Ice</option>
                    <option value="Normal">Normal</option>
                    <option value="Poison">Poison</option>
                    <option value="Psychic">Psychic</option>
                    <option value="Rock">Rock</option>
                    <option value="Steel">Steel</option>
                    <option value="Water">Water</option>
                </select>
                <small id="type-pool-note" aria-live="polite"></small>
            </div>

            <div class="setting" id="maximum-tier-setting">
                <label for="tier-select">Maximum Tier</label>

                <select id="tier-select">
                    <option value="Uber">Uber</option>
                    <option value="OU">OU</option>
                    <option value="UU">UU</option>
                    <option value="RU">RU</option>
                    <option value="NU">NU</option>
                    <option value="PU">PU</option>
                    <option value="ZU">ZU</option>
                </select>
            </div>

            <div class="setting">
                <label for="odds-select">Odds</label>

                <select id="odds-select">
                    <option value="--">--</option>
                    <option value="-">-</option>
                    <option value="=" selected>=</option>
                    <option value="+">+</option>
                    <option value="++">++</option>
                </select>
            </div>

        </div>

        <button id="generate-button">
            Generate Pokémon
        </button>

        <div id="results">

            <div class="pokemon-card">?</div>
            <div class="pokemon-card">?</div>
            <div class="pokemon-card">?</div>
            <div class="pokemon-card">?</div>
            <div class="pokemon-card">?</div>
            <div class="pokemon-card">?</div>

        </div>

    </main>

    <!--
        Full-screen reveal sequence.

        The generator secretly creates the six Pokémon first.
        This overlay then reveals only the color of the
        strongest tier before the actual Pokémon are shown.
    -->
    <div
        id="reveal-overlay"
        class="reveal-overlay"
        aria-hidden="true"
    >
        <div class="reveal-stage">
            <div class="special-reveal-frame" aria-hidden="true"></div>
            <div class="special-reveal-halo" aria-hidden="true"></div>
            <div class="special-portal" aria-hidden="true">
                <div class="special-portal-ring portal-ring-one"></div>
                <div class="special-portal-ring portal-ring-two"></div>
            </div>
            <div class="special-crystal" aria-hidden="true"></div>
            <div class="special-shockwave" aria-hidden="true"></div>
            <div id="reveal-special-label" class="reveal-special-label"></div>
            <div class="reveal-ring reveal-ring-one"></div>
            <div class="reveal-ring reveal-ring-two"></div>
            <div class="reveal-orb">
                <div id="reveal-type-text" class="reveal-type-text" aria-hidden="true"></div>
            </div>

            <div class="reveal-pokeball" aria-hidden="true">
                <div class="pokeball-center"></div>
            </div>

            <div class="reveal-flares" aria-hidden="true">
                <div class="reveal-flare flare-a"></div>
                <div class="reveal-flare flare-b"></div>
                <div class="reveal-flare flare-c"></div>
                <div class="reveal-flare flare-d"></div>
            </div>

            <img
                id="reveal-preview-sprite"
                class="reveal-preview-sprite"
                src=""
                alt=""
            >

            <div
                id="reveal-pokemon-name"
                class="reveal-pokemon-name"
            ></div>

            <div
                id="reveal-tier-name"
                class="reveal-tier-name"
                aria-live="polite"
            ></div>
            <div id="reveal-pull-chance" class="reveal-pull-chance" aria-live="polite"></div>

            <button
                id="reveal-continue-button"
                class="reveal-continue-button"
                type="button"
            >
                Continue
            </button>
        </div>

        <div class="reveal-flash"></div>
    </div>

    <dialog id="pokemon-details-dialog" aria-labelledby="pokemon-details-title">
        <div class="details-heading">
            <h2 id="pokemon-details-title">Pokémon details</h2>
            <button id="pokemon-details-close" type="button" aria-label="Close Pokémon details">Close</button>
        </div>
        <div id="pokemon-details-content"></div>
    </dialog>

</body>

</html>
