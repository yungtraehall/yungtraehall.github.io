name: Validate Gen 1 integration

on:
  push:
    paths:
      - ".github/workflows/fetch-gen1-stats.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check data/gen1.js
          node --check data/gen2.js
          node --check data/gen3.js
          node --check data/gen4.js
          node --check data/gen5.js
          node --check js/script.js

      - name: Validate Generation 1 dataset and odds
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          const src =
            fs.readFileSync("data/gen1.js","utf8") +
            "\nglobalThis.data=GEN1_POKEMON;" +
            "\nglobalThis.meta=GEN1_DATASET_META;";

          const ctx = {};
          vm.createContext(ctx);
          vm.runInContext(src,ctx);

          const data=ctx.data;
          const meta=ctx.meta;
          const tierOrder=["ZU","PU","NU","RU","UU","OU","Uber"];
          const odds={ZU:30,PU:22,NU:18,RU:14,UU:10,OU:5.5,Uber:0.5};
          const expected={Uber:2,OU:11,UU:17,RU:0,NU:20,PU:0,ZU:0};

          if(data.length!==50) throw new Error("Expected 50 entries");

          const ids=new Set(data.map(p=>p.id));
          if(ids.size!==data.length) throw new Error("Duplicate IDs");

          const counts={};
          for(const p of data){
            counts[p.tier]=(counts[p.tier]||0)+1;
            if(!p.fullyEvolved) throw new Error("NFE flag: "+p.name);
            const source=p.tier==="Uber"?"gen1ubers":"gen1ou";
            if(p.usageSource!==source) throw new Error("Wrong usage source: "+p.name);
          }

          for(const [t,n] of Object.entries(expected)){
            if((counts[t]||0)!==n) throw new Error("Bad count "+t);
          }

          if(data.filter(p=>p.usage.recorded).length!==50) throw new Error("Usage mismatch");
          if(meta.battles.gen1ou!==14193 || meta.battles.gen1ubers!==1924) throw new Error("Battle totals mismatch");

          for(const tier of tierOrder){
            const xs=data.filter(p=>p.tier===tier);
            xs.forEach(p=>p.usageModifier=1);
            const rec=xs.filter(p=>p.usage.recorded&&typeof p.usage.usagePct==="number");
            if(rec.length<2) continue;
            for(const p of rec){
              const higher=rec.filter(q=>q.usage.usagePct>p.usage.usagePct).length;
              const equal=rec.filter(q=>q.usage.usagePct===p.usage.usagePct).length;
              p.usageModifier=.85+((higher+(equal-1)/2)/(rec.length-1))*.30;
            }
          }

          let seed=0x12345678;
          function random(){
            seed=(Math.imul(1664525,seed)+1013904223)>>>0;
            return seed/4294967296;
          }

          function choose(items,getWeight){
            let total=0;
            for(const x of items) total+=getWeight(x);
            let n=random()*total;
            for(const x of items){
              n-=getWeight(x);
              if(n<=0) return x;
            }
            return items[items.length-1];
          }

          function chooseTier(available,pool,maxTier){
            const max=tierOrder.indexOf(maxTier);
            const ceiling=tierOrder.slice(0,max+1);
            const structural=ceiling.filter(t=>pool.some(p=>p.tier===t));
            const availableTiers=structural.filter(t=>available.some(p=>p.tier===t));
            const weights=Object.fromEntries(structural.map(t=>[t,0]));

            for(const tier of ceiling){
              const pos=tierOrder.indexOf(tier);
              let target=tier;

              if(!structural.includes(tier)){
                target=null;

                for(let i=pos-1;i>=0;i--){
                  if(structural.includes(tierOrder[i])){
                    target=tierOrder[i];
                    break;
                  }
                }

                if(!target){
                  for(let i=pos+1;i<=max;i++){
                    if(structural.includes(tierOrder[i])){
                      target=tierOrder[i];
                      break;
                    }
                  }
                }
              }

              if(target) weights[target]+=odds[tier];
            }

            return choose(availableTiers,t=>weights[t]);
          }

          function team(maxTier="Uber"){
            const max=tierOrder.indexOf(maxTier);
            const pool=data.filter(p=>tierOrder.indexOf(p.tier)<=max);
            if(pool.length<6) throw new Error("Not enough eligible for "+maxTier);

            const available=pool.slice();
            const out=[];

            for(let i=0;i<6;i++){
              const tier=chooseTier(available,pool,maxTier);
              const candidates=available.filter(p=>p.tier===tier);
              const picked=choose(candidates,p=>p.usageModifier);
              out.push(picked);
              available.splice(available.findIndex(p=>p.id===picked.id),1);
            }

            return out;
          }

          const slotCounts=Object.fromEntries(tierOrder.map(t=>[t,0]));
          let duplicateTeams=0;
          let uberTeams=0;
          const N=100000;

          for(let i=0;i<N;i++){
            const x=team();
            if(new Set(x.map(p=>p.id)).size!==6) duplicateTeams++;
            if(x.some(p=>p.tier==="Uber")) uberTeams++;
            for(const p of x) slotCounts[p.tier]++;
          }

          if(duplicateTeams) throw new Error("Duplicate teams: "+duplicateTeams);

          const ceilings={};
          for(const t of tierOrder){
            const max=tierOrder.indexOf(t);
            const eligible=data.filter(p=>tierOrder.indexOf(p.tier)<=max);

            if(eligible.length<6){
              ceilings[t]="disabled";
              continue;
            }

            ceilings[t]=team(t).every(p=>tierOrder.indexOf(p.tier)<=max);
            if(!ceilings[t]) throw new Error("Ceiling failed "+t);
          }

          const pct=Object.fromEntries(
            tierOrder.map(t=>[
              t,
              +(100*slotCounts[t]/(N*6)).toFixed(3)
            ])
          );

          if(Math.abs(pct.Uber-0.5)>0.08) throw new Error("Uber rate drifted: "+pct.Uber);
          if(Math.abs(pct.OU-5.5)>0.15) throw new Error("OU rate drifted: "+pct.OU);

          console.log("Gen 1 validation passed.");
          console.log("Entries:",data.length);
          console.log("Tier counts:",JSON.stringify(counts));
          console.log("Usage recorded:",data.filter(p=>p.usage.recorded).length);
          console.log("Usage missing:",data.filter(p=>!p.usage.recorded).length);
          console.log("Battle counts:",JSON.stringify(meta.battles));
          console.log("100k slot rates:",JSON.stringify(pct));
          console.log("Teams with Uber:",(100*uberTeams/N).toFixed(3)+"%");
          console.log("Ceilings:",JSON.stringify(ceilings));
          NODE
