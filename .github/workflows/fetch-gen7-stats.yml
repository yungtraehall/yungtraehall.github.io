name: Validate Gen 7 integration

on:
  push:
    paths:
      - ".github/workflows/fetch-gen7-stats.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check data/gen1.js
          node --check data/gen2.js
          node --check data/gen3.js
          node --check data/gen4.js
          node --check data/gen5.js
          node --check data/gen6.js
          node --check data/gen7.js
          node --check js/script.js

      - name: Validate Generation 7 dataset and odds
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          const source =
            fs.readFileSync("data/gen7.js","utf8") +
            "\nglobalThis.data=GEN7_POKEMON;" +
            "\nglobalThis.meta=GEN7_DATASET_META;";

          const ctx = {};
          vm.createContext(ctx);
          vm.runInContext(source,ctx);

          const data=ctx.data;
          const meta=ctx.meta;

          const tierOrder=["ZU","PU","NU","RU","UU","OU","Uber"];
          const odds={ZU:30,PU:22,NU:18,RU:14,UU:10,OU:5.5,Uber:0.5};
          const expected={Uber:67,OU:77,UU:68,RU:68,NU:63,PU:54,ZU:184};

          if(data.length!==581){
            throw new Error("Expected 581 entries, got "+data.length);
          }

          if(meta.megaFormCount!==47){
            throw new Error("Expected 47 Mega forms, got "+meta.megaFormCount);
          }

          const ids=new Set(data.map(p=>p.id));
          if(ids.size!==data.length){
            throw new Error("Duplicate Gen 7 IDs");
          }

          const counts={};
          for(const p of data){
            counts[p.tier]=(counts[p.tier]||0)+1;

            if(!p.fullyEvolved){
              throw new Error("NFE flag: "+p.name);
            }

            const expectedSource=p.tier==="Uber"?"gen7ubers":"gen7ou";
            if(p.usageSource!==expectedSource){
              throw new Error("Wrong usage source: "+p.name);
            }
          }

          for(const [tier,n] of Object.entries(expected)){
            if((counts[tier]||0)!==n){
              throw new Error("Bad tier count "+tier+": "+(counts[tier]||0));
            }
          }

          const recorded=data.filter(p=>p.usage.recorded).length;
          if(recorded!==569){
            throw new Error("Expected 569 usage matches, got "+recorded);
          }

          const missing=data.filter(p=>!p.usage.recorded).map(p=>p.name).sort();
          const expectedMissing=[
            "Basculin-Blue-Striped",
            "Genesect-Burn",
            "Genesect-Chill",
            "Genesect-Douse",
            "Genesect-Shock",
            "Greninja-Bond",
            "Keldeo-Resolute",
            "Meowstic-F",
            "Necrozma-Ultra",
            "Vivillon-Fancy",
            "Vivillon-Pokeball",
            "Zygarde-Complete"
          ].sort();

          if(JSON.stringify(missing)!==JSON.stringify(expectedMissing)){
            throw new Error("Unexpected missing usage set: "+JSON.stringify(missing));
          }

          if(meta.battles.gen7ou!==2005100){
            throw new Error("Unexpected OU battle count");
          }

          if(meta.battles.gen7ubers!==390324){
            throw new Error("Unexpected Ubers battle count");
          }

          for(const tier of tierOrder){
            const xs=data.filter(p=>p.tier===tier);
            xs.forEach(p=>p.usageModifier=1);

            const rec=xs.filter(
              p=>p.usage && p.usage.recorded &&
              typeof p.usage.usagePct==="number"
            );

            if(rec.length<2) continue;

            for(const p of rec){
              const higher=rec.filter(q=>q.usage.usagePct>p.usage.usagePct).length;
              const equal=rec.filter(q=>q.usage.usagePct===p.usage.usagePct).length;
              const position=higher+((equal-1)/2);
              const percentile=position/(rec.length-1);
              p.usageModifier=.85+percentile*.30;
            }
          }

          let seed=0x12345678;
          function random(){
            seed=(Math.imul(1664525,seed)+1013904223)>>>0;
            return seed/4294967296;
          }

          function choose(items,getWeight){
            let total=0;
            for(const x of items) total+=getWeight(x);

            let n=random()*total;
            for(const x of items){
              n-=getWeight(x);
              if(n<=0) return x;
            }

            return items[items.length-1];
          }

          function team(maxTier="Uber"){
            const max=tierOrder.indexOf(maxTier);
            const available=data
              .filter(p=>tierOrder.indexOf(p.tier)<=max)
              .slice();

            const out=[];

            for(let i=0;i<6;i++){
              const tiers=tierOrder
                .slice(0,max+1)
                .filter(t=>available.some(p=>p.tier===t));

              const tier=choose(tiers,t=>odds[t]);
              const candidates=available.filter(p=>p.tier===tier);
              const picked=choose(candidates,p=>p.usageModifier);

              out.push(picked);
              available.splice(
                available.findIndex(p=>p.id===picked.id),
                1
              );
            }

            return out;
          }

          const slotCounts=Object.fromEntries(tierOrder.map(t=>[t,0]));
          let duplicateTeams=0;
          let uberTeams=0;
          const N=100000;

          for(let i=0;i<N;i++){
            const x=team();

            if(new Set(x.map(p=>p.id)).size!==6){
              duplicateTeams++;
            }

            if(x.some(p=>p.tier==="Uber")){
              uberTeams++;
            }

            for(const p of x){
              slotCounts[p.tier]++;
            }
          }

          if(duplicateTeams!==0){
            throw new Error("Duplicate teams: "+duplicateTeams);
          }

          const ceilings={};

          for(const t of tierOrder){
            const max=tierOrder.indexOf(t);
            const x=team(t);

            ceilings[t]=x.every(
              p=>tierOrder.indexOf(p.tier)<=max
            );

            if(!ceilings[t]){
              throw new Error("Ceiling failed "+t);
            }
          }

          const pct=Object.fromEntries(
            tierOrder.map(t=>[
              t,
              +(100*slotCounts[t]/(N*6)).toFixed(3)
            ])
          );

          console.log("Gen 7 validation passed.");
          console.log("Entries:",data.length);
          console.log("Mega forms:",meta.megaFormCount);
          console.log("Tier counts:",JSON.stringify(counts));
          console.log("Usage recorded:",recorded);
          console.log("Usage missing:",data.length-recorded);
          console.log("Battle counts:",JSON.stringify(meta.battles));
          console.log("100k slot rates:",JSON.stringify(pct));
          console.log("Teams with Uber:",(100*uberTeams/N).toFixed(3)+"%");
          console.log("Ceilings:",JSON.stringify(ceilings));
          NODE

      - name: Check representative Gen 7 sprite URLs
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://play.pokemonshowdown.com/sprites/ani/necrozma-duskmane.gif"
            "https://play.pokemonshowdown.com/sprites/ani/necrozma-dawnwings.gif"
            "https://play.pokemonshowdown.com/sprites/ani/greninja-ash.gif"
            "https://play.pokemonshowdown.com/sprites/ani/lycanroc-dusk.gif"
          )

          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl --fail --silent --show-error --location --output /dev/null "$url"
          done

          echo "Representative Gen 7 sprite URLs passed."
