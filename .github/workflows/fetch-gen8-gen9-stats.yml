name: Validate Gen 8 and 9 integration

on:
  push:
    paths:
      - ".github/workflows/fetch-gen8-gen9-stats.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check data/gen1.js
          node --check data/gen2.js
          node --check data/gen3.js
          node --check data/gen4.js
          node --check data/gen5.js
          node --check data/gen6.js
          node --check data/gen7.js
          node --check data/gen8.js
          node --check data/gen9.js
          node --check js/script.js

      - name: Validate Generation 8 and 9 datasets and odds
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          function load(gen) {
            const source =
              fs.readFileSync(`data/gen${gen}.js`, "utf8") +
              `\nglobalThis.data=GEN${gen}_POKEMON;` +
              `\nglobalThis.meta=GEN${gen}_DATASET_META;`;

            const ctx = {};
            vm.createContext(ctx);
            vm.runInContext(source, ctx);
            return {data: ctx.data, meta: ctx.meta};
          }

          const tierOrder=["ZU","PU","NU","RU","UU","OU","Uber"];
          const odds={ZU:30,PU:22,NU:18,RU:14,UU:10,OU:5.5,Uber:0.5};

          const expected = {
            8: {
              count:454,
              recorded:428,
              counts:{Uber:46,OU:51,UU:46,RU:54,NU:47,PU:52,ZU:158},
              battles:{gen8ou:1574044,gen8ubers:130571}
            },
            9: {
              count:514,
              recorded:485,
              counts:{Uber:72,OU:58,UU:54,RU:56,NU:39,PU:56,ZU:179},
              battles:{gen9ou:730502,gen9ubers:78012}
            }
          };

          function assignUsageModifiers(data) {
            for (const tier of tierOrder) {
              const xs=data.filter(p=>p.tier===tier);

              for (const p of xs) p.usageModifier=1;

              const rec=xs.filter(
                p=>p.usage &&
                   p.usage.recorded &&
                   typeof p.usage.usagePct==="number"
              );

              if(rec.length<2) continue;

              for(const p of rec){
                const higher=rec.filter(
                  q=>q.usage.usagePct>p.usage.usagePct
                ).length;

                const equal=rec.filter(
                  q=>q.usage.usagePct===p.usage.usagePct
                ).length;

                const position=higher+((equal-1)/2);
                const percentile=position/(rec.length-1);

                p.usageModifier=.85+percentile*.30;
              }
            }
          }

          let seed=0x12345678;
          function random(){
            seed=(Math.imul(1664525,seed)+1013904223)>>>0;
            return seed/4294967296;
          }

          function choose(items,getWeight){
            let total=0;
            for(const x of items) total+=getWeight(x);

            let n=random()*total;
            for(const x of items){
              n-=getWeight(x);
              if(n<=0) return x;
            }

            return items[items.length-1];
          }

          function generateTeam(data,maxTier="Uber"){
            const max=tierOrder.indexOf(maxTier);
            const available=data
              .filter(p=>tierOrder.indexOf(p.tier)<=max)
              .slice();

            const out=[];

            for(let i=0;i<6;i++){
              const tiers=tierOrder
                .slice(0,max+1)
                .filter(t=>available.some(p=>p.tier===t));

              const tier=choose(tiers,t=>odds[t]);
              const candidates=available.filter(p=>p.tier===tier);
              const picked=choose(candidates,p=>p.usageModifier);

              out.push(picked);
              available.splice(
                available.findIndex(p=>p.id===picked.id),
                1
              );
            }

            return out;
          }

          for(const gen of [8,9]){
            const {data,meta}=load(gen);
            const exp=expected[gen];

            if(data.length!==exp.count){
              throw new Error(`Gen ${gen}: expected ${exp.count}, got ${data.length}`);
            }

            const ids=new Set(data.map(p=>p.id));
            if(ids.size!==data.length){
              throw new Error(`Gen ${gen}: duplicate IDs`);
            }

            const counts={};
            for(const p of data){
              counts[p.tier]=(counts[p.tier]||0)+1;

              if(!p.fullyEvolved){
                throw new Error(`Gen ${gen}: NFE flag on ${p.name}`);
              }

              const expectedSource=
                p.tier==="Uber"
                  ? `gen${gen}ubers`
                  : `gen${gen}ou`;

              if(p.usageSource!==expectedSource){
                throw new Error(
                  `Gen ${gen}: wrong usage source for ${p.name}`
                );
              }
            }

            for(const [tier,n] of Object.entries(exp.counts)){
              if((counts[tier]||0)!==n){
                throw new Error(
                  `Gen ${gen}: bad tier count ${tier}: ${counts[tier]||0}`
                );
              }
            }

            const recorded=data.filter(p=>p.usage.recorded).length;
            if(recorded!==exp.recorded){
              throw new Error(
                `Gen ${gen}: expected ${exp.recorded} usage matches, got ${recorded}`
              );
            }

            for(const [k,v] of Object.entries(exp.battles)){
              if(meta.battles[k]!==v){
                throw new Error(
                  `Gen ${gen}: unexpected battle count for ${k}`
                );
              }
            }

            if(gen===8){
              if(!data.some(p=>p.name==="Bisharp")){
                throw new Error("Gen 8: Bisharp should remain fully evolved");
              }
              if(data.some(p=>p.name==="Kingambit")){
                throw new Error("Gen 8: Kingambit must not exist");
              }
              for(const name of ["Zacian","Zacian-Crowned"]){
                const p=data.find(x=>x.name===name);
                if(!p || p.sourceTier!=="AG" || p.tier!=="Uber"){
                  throw new Error("Gen 8: AG mapping failed for "+name);
                }
              }
              if(data.some(p=>/Gmax$/i.test(p.name))){
                throw new Error("Gen 8: Gigantamax form leaked into generator pool");
              }
            }

            if(gen===9){
              if(data.some(p=>p.name==="Bisharp")){
                throw new Error("Gen 9: Bisharp should be excluded as evolvable");
              }
              if(!data.some(p=>p.name==="Kingambit")){
                throw new Error("Gen 9: Kingambit missing");
              }
              if(data.some(p=>p.name==="Duraludon")){
                throw new Error("Gen 9: Duraludon should be excluded as evolvable");
              }
              if(!data.some(p=>p.name==="Archaludon")){
                throw new Error("Gen 9: Archaludon missing");
              }
            }

            assignUsageModifiers(data);

            const slotCounts=Object.fromEntries(
              tierOrder.map(t=>[t,0])
            );

            let duplicateTeams=0;
            let uberTeams=0;
            const N=100000;

            for(let i=0;i<N;i++){
              const team=generateTeam(data);

              if(new Set(team.map(p=>p.id)).size!==6){
                duplicateTeams++;
              }

              if(team.some(p=>p.tier==="Uber")){
                uberTeams++;
              }

              for(const p of team){
                slotCounts[p.tier]++;
              }
            }

            if(duplicateTeams!==0){
              throw new Error(
                `Gen ${gen}: duplicate teams ${duplicateTeams}`
              );
            }

            const ceilings={};
            for(const t of tierOrder){
              const max=tierOrder.indexOf(t);
              const team=generateTeam(data,t);

              ceilings[t]=team.every(
                p=>tierOrder.indexOf(p.tier)<=max
              );

              if(!ceilings[t]){
                throw new Error(
                  `Gen ${gen}: ceiling failed ${t}`
                );
              }
            }

            const pct=Object.fromEntries(
              tierOrder.map(t=>[
                t,
                +(100*slotCounts[t]/(N*6)).toFixed(3)
              ])
            );

            console.log(`Gen ${gen} validation passed.`);
            console.log("Entries:",data.length);
            console.log("Tier counts:",JSON.stringify(counts));
            console.log("Usage recorded:",recorded);
            console.log("Usage missing:",data.length-recorded);
            console.log("Battle counts:",JSON.stringify(meta.battles));
            console.log("100k slot rates:",JSON.stringify(pct));
            console.log(
              "Teams with Uber:",
              (100*uberTeams/N).toFixed(3)+"%"
            );
            console.log("Ceilings:",JSON.stringify(ceilings));
          }
          NODE

      - name: Check representative Gen 8 and 9 sprite fallbacks
        shell: bash
        run: |
          set -euo pipefail

          check_sprite() {
            local gen="$1"
            local label="$2"
            shift 2
            local slugs=("$@")

            for slug in "${slugs[@]}"; do
              for dir in ani xyani; do
                local url="https://play.pokemonshowdown.com/sprites/${dir}/${slug}.gif"
                echo "Trying ${label}: ${url}"
                if curl --fail --silent --location --max-time 10 --output /dev/null "${url}"; then
                  echo "Working sprite for ${label}: ${url}"
                  return 0
                fi
              done

              for static_dir in "gen${gen}" gen5 home; do
                local static_url="https://play.pokemonshowdown.com/sprites/${static_dir}/${slug}.png"
                echo "Trying ${label}: ${static_url}"
                if curl --fail --silent --location --max-time 10 --output /dev/null "${static_url}"; then
                  echo "Working sprite for ${label}: ${static_url}"
                  return 0
                fi
              done
            done

            echo "No working sprite found for ${label}" >&2
            return 1
          }

          check_sprite 8 "Zacian-Crowned" \
            "zacian-crowned" "zaciancrowned"

          check_sprite 8 "Calyrex-Shadow" \
            "calyrex-shadow" "calyrexshadow"

          check_sprite 8 "Urshifu-Rapid-Strike" \
            "urshifu-rapidstrike" "urshifu-rapid-strike" "urshifurapidstrike"

          check_sprite 9 "Ogerpon-Wellspring" \
            "ogerpon-wellspring" "ogerponwellspring"

          check_sprite 9 "Palafin-Hero" \
            "palafin-hero" "palafinhero"

          check_sprite 9 "Terapagos-Terastal" \
            "terapagos-terastal" "terapagosterastal"

          check_sprite 9 "Dudunsparce-Three-Segment" \
            "dudunsparce-threesegment" "dudunsparce-three-segment" "dudunsparcethreesegment"

          echo "Representative Gen 8/9 sprite fallback validation passed."
